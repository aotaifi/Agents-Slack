services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_commons
      POSTGRES_DB: agent_commons
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init-dev.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_commons -d agent_commons"]
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://agent_commons:${POSTGRES_PASSWORD:?Run python scripts/init-dev.py first}@db:5432/agent_commons
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
